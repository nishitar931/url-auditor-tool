<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <style>
        :root {
            --bg: #090d16;
            --card-bg: #111827;
            --border: #1f2937;
            --text: #f9fafb;
            --text-muted: #9ca3af;
            --accent: #0ea5e9;
            --accent-hover: #0284c7;
            --danger: #ef4444;
            --success: #10b981;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            width: 100%;
            padding: 1.25rem 2rem;
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-weight: 700;
            font-size: 1.25rem;
            color: var(--accent);
        }

        main {
            max-width: 900px;
            width: 90%;
            margin: 3rem auto;
        }

        .hero {
            text-align: center;
            margin-bottom: 2rem;
        }

        .hero h1 {
            font-size: 2.25rem;
            margin-bottom: 0.5rem;
        }

        .hero p {
            color: var(--text-muted);
            font-size: 1rem;
        }

        .search-box {
            display: flex;
            gap: 0.75rem;
            background-color: var(--card-bg);
            padding: 0.75rem;
            border-radius: 12px;
            border: 1px solid var(--border);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
            margin-bottom: 2rem;
        }

        .search-box input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text);
            font-size: 1rem;
            padding: 0.5rem 0.75rem;
        }

        .search-box button {
            background-color: var(--accent);
            color: #000;
            border: none;
            padding: 0.75rem 1.5rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .search-box button:hover {
            background-color: var(--accent-hover);
        }

        .search-box button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .error-card {
            background-color: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: var(--danger);
            padding: 1rem 1.25rem;
            border-radius: 8px;
            margin-bottom: 2rem;
            display: none;
        }

        .results-container {
            display: none;
            flex-direction: column;
            gap: 1.5rem;
        }

        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
        }

        .metric-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 1.25rem;
        }

        .metric-card .label {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
        }

        .metric-card .value {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--accent);
        }

        .detail-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 1.5rem;
        }

        .detail-card h3 {
            font-size: 1.1rem;
            margin-bottom: 0.75rem;
            color: var(--text);
        }

        .detail-card p {
            color: var(--text-muted);
            font-size: 0.95rem;
            line-height: 1.5;
            word-break: break-word;
        }

        .badge-status {
            display: inline-block;
            padding: 0.25rem 0.6rem;
            border-radius: 6px;
            font-size: 0.9rem;
            font-weight: 600;
        }

        .badge-200 { background-color: rgba(16, 185, 129, 0.15); color: var(--success); }
        .badge-err { background-color: rgba(239, 68, 68, 0.15); color: var(--danger); }
    </style>
</head>
<body>

    <header>
        <div class="logo">🔍 Web Audit Engine</div>
    </header>

    <main>
        <div class="hero">
            <h1>Web Page Audit Tool</h1>
            <p>Enter any URL below to inspect performance, SEO tags, and content metrics.</p>
        </div>

        <form class="search-box" id="audit-form" onsubmit="runAudit(event)">
            <input type="text" id="url-input" placeholder="https://example.com" required autocomplete="off">
            <button type="submit" id="submit-btn">Audit URL</button>
        </form>

        <div id="error-box" class="error-card"></div>

        <div id="results" class="results-container">
            <div class="metrics-grid">
                <div class="metric-card">
                    <div class="label">HTTP Status</div>
                    <div class="value" id="res-status">-</div>
                </div>
                <div class="metric-card">
                    <div class="label">Response Time</div>
                    <div class="value" id="res-time">-</div>
                </div>
                <div class="metric-card">
                    <div class="label">H1 Headings</div>
                    <div class="value" id="res-h1">-</div>
                </div>
                <div class="metric-card">
                    <div class="label">Images Missing Alt</div>
                    <div class="value" id="res-alt">-</div>
                </div>
                <div class="metric-card">
                    <div class="label">Approx Word Count</div>
                    <div class="value" id="res-words">-</div>
                </div>
            </div>

            <div class="detail-card">
                <h3>Page Title</h3>
                <p id="res-title">-</p>
            </div>

            <div class="detail-card">
                <h3>Meta Description</h3>
                <p id="res-desc">-</p>
            </div>
        </div>
    </main>

    <script>
        async function runAudit(event) {
            event.preventDefault();
            
            const urlInput = document.getElementById('url-input').value.trim();
            const submitBtn = document.getElementById('submit-btn');
            const errorBox = document.getElementById('error-box');
            const resultsContainer = document.getElementById('results');

            if (!urlInput) return;

            // Reset state
            errorBox.style.display = 'none';
            resultsContainer.style.display = 'none';
            submitBtn.disabled = true;
            submitBtn.innerText = 'Auditing...';

            try {
                const response = await fetch('/api/audit', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url: urlInput })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'An unexpected server error occurred.');
                }

                // Render metrics
                const statusBadge = `<span class="badge-status ${data.status_code === 200 ? 'badge-200' : 'badge-err'}">${data.status_code}</span>`;
                document.getElementById('res-status').innerHTML = statusBadge;
                document.getElementById('res-time').innerText = `${data.response_time_ms} ms`;
                document.getElementById('res-h1').innerText = data.h1_count;
                document.getElementById('res-alt').innerText = `${data.images_missing_alt} / ${data.total_images}`;
                document.getElementById('res-words').innerText = data.word_count.toLocaleString();
                document.getElementById('res-title').innerText = data.page_title;
                document.getElementById('res-desc').innerText = data.meta_description;

                resultsContainer.style.display = 'flex';
            } catch (err) {
                errorBox.innerText = err.message;
                errorBox.style.display = 'block';
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = 'Audit URL';
            }
        }
    </script>
</body>
</html>
